[project]
name = "discord-research-assistance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.49.1",
    "discord-py>=2.7.1",
    "google-genai>=2.18.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "yt-dlp>=2026.7.4",
    "PyNaCl>=1.6.2",
    "davey>=0.1.6",
    "pillow>=12.3.0",
    "aiosqlite>=0.22.1",
    "firebase-admin>=6.5.0",
    "pyxelate",
    "ruff==0.16.6",
    "pre-commit>=4.6.2",
]

[tool.uv.sources]
pyxelate = { git = "https://github.com/sedthh/pyxelate.git" }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["D"]
ignore = [
    "D203",  # 1 blank line required before class docstring (incompatible with D211)
    "D213",  # Multi-line docstring summary should start at the second line (incompatible with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"test/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
